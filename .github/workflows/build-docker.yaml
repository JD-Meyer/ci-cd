# .github/workflows/build-docker.yaml
# reusable workflow to build docker images
name: Reusable - Build and Push Docker Image

on:
  workflow_call:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Permissions are required to write to the container
    permissions:
      contents: read    # To checkout code
      packages: write   # To push the image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GH Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub has a problem with repo names that have upper-case letters in them.
      - name: Set lowercase repo name   # GH Actions does not have a toLower() function, but it does have string manipulation
        id: vars
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker img
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.repo }}:latest