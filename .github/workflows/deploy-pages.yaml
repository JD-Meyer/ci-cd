# .github/workflows/deploy-pages.yaml
# Deploy to GitHub Pages
name: Reusable - Deploy to GitHub Pages

on:
  # Adding a workflow_call to make this workflow reusable
  workflow_call:
    environment-name:
      description: 'Takes the name of the environment as input'
      required: true
      type: string

jobs:
  # This job's only responsibility is to deploy.
  deploy:
    name: Deploy to Pages ${{ inputs.environment-name }}
    # 1. Define the runner
    runs-on: ubuntu-latest
      # 2. Permissions are required for the deploy action to work.
    permissions:
      pages: write
      id-token: write
    # 3. The deployment environment
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ steps.deployment.outputs.page_url }}
    # 4. The steps to run
    steps:
      # It's best practice to use a more specific version of actions
      # to avoid unexpected breaking changes.
      # Deploy the artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4               # 4. Deploy!