# .github/workflows/build-application.yaml
# A reusable workflow to build the web application and produce a Pages artifact
name: Reusable - Build Application

on:
  workflow_call:

jobs:
  build:
    name: Build and Lint Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4                   # 1. Get the code to run

      - name: Set up node.js                        # 2. Set up the runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                              # npm's cache speeds up runtime on future builds

      - name: Install dependencies                  # 3. Install dependencies
        run: npm ci

      - name: Run HTML Linter                       # 4. Run the HTML linter
        run: npx htmlhint "**/*.html"

      - name: Create new artifacts directory        # 5. create the artifacts directory for the build artifact
        run: |
          mkdir build
          mv index.html build/

      - name: Upload artifact                       # Now upload an artifact to GH Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Stick the artifact in the build directory
          path: './build'